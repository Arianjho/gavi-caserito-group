# Despliegue completo de Gavi Caserito: web (nginx), API, cola, planificador y Redis.
# La base de datos PostgreSQL es un servicio aparte: se configura con DB_* en .env.docker.
#
# Uso:
#   cp .env.docker.example .env.docker      # y completa los valores
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up -d --build
#
# La web queda en http://localhost:${WEB_PORT:-80}; la API solo es accesible a través de ella (/api).
x-api: &api
  build: ./apps/api
  env_file: .env.docker
  environment: &api-env
    REDIS_HOST: redis
    REDIS_CLIENT: predis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    <<: *api
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
